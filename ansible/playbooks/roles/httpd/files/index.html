<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ansible Practise App</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1b1f24;
      --muted: #5c6672;
      --accent: #2f6feb;
      --border: #e2e6ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14181d;
        --card: #1c2128;
        --text: #e8eaed;
        --muted: #9aa4b0;
        --accent: #6c9cf5;
        --border: #2b323b;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
    }

    main {
      width: 100%;
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
    }

    .tag {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    dt { color: var(--muted); }

    dd {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    footer {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">App Server</span>
    <h1>Deployment successful</h1>
    <p>This page was copied to the web root by Ansible.</p>

    <dl>
      <dt>Role</dt>
      <dd>app</dd>
      <dt>Served by</dt>
      <dd id="host">this host</dd>
      <dt>Provisioned by</dt>
      <dd>Terraform + Ansible</dd>
    </dl>

    <footer>
      ansible-terraform-practise-001
    </footer>
  </main>

  <script>
    document.getElementById("host").textContent = location.hostname;
  </script>
</body>
</html>
